name: Android (prototype)

# main に push したとき (画面や部品が変わったとき) と、手で動かしたときに、スマホ版の APK を作って Actions の成果物として置く。
# 手順は android-build.yml にまとめてある。リリースのときは release.yml が同じ手順を呼び、Release に APK を加える
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    secrets: inherit
