<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- CSP: 自分のファイル以外のスクリプトや CSS を読み込ませない安全対策 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="work">
  <div class="update-banner" id="update-banner" role="status" hidden>
    <span id="update-text"></span>
    <progress id="update-progress" max="100" value="0" hidden></progress>
    <span class="update-actions">
      <button type="button" id="update-action" class="small"></button>
      <button type="button" id="update-later" class="small ghost">あとで</button>
    </span>
  </div>

  <main class="app">
    <nav class="modes" aria-label="モード">
      <span class="mode-tab" data-mode-tab="work">作業</span>
      <span class="mode-tab" data-mode-tab="shortBreak">短い休憩</span>
      <span class="mode-tab" data-mode-tab="longBreak">長い休憩</span>
    </nav>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="90"></circle>
        <circle class="progress" id="progress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="readout">
        <div class="time" id="time">25:00</div>
        <div class="label" id="label">作業</div>
      </div>
    </div>

    <div class="controls">
      <button id="reset" class="secondary" title="リセット">リセット</button>
      <button id="toggle" class="primary">スタート</button>
      <button id="skip" class="secondary" title="次へスキップ">スキップ</button>
    </div>

    <p class="stats">今日の完了: <strong id="today">0</strong> 回 ・ セット内 <strong id="cycle">0</strong>/<span id="interval">4</span></p>

    <details class="settings">
      <summary>設定</summary>
      <form id="settings-form">
        <label>作業 (分) <input type="number" name="workMinutes" min="1" max="120" required></label>
        <label>短い休憩 (分) <input type="number" name="shortBreakMinutes" min="1" max="60" required></label>
        <label>長い休憩 (分) <input type="number" name="longBreakMinutes" min="1" max="120" required></label>
        <label>長い休憩までの回数 <input type="number" name="longBreakInterval" min="2" max="10" required></label>
        <label>終わったら次を自動で開始 <input type="checkbox" name="autoStart"></label>
        <label>音量
          <span class="volume">
            <input type="range" name="volume" min="0" max="100" step="5">
            <output id="volume-value"></output>
            <button type="button" id="preview" class="secondary small">試聴</button>
          </span>
        </label>
        <button type="submit" class="secondary">保存</button>
      </form>
      <p class="version" id="app-version" hidden></p>
    </details>
  </main>
  <script type="module" src="renderer.js"></script>
</body>
</html>
