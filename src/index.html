<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- CSP: 自分のファイル以外のスクリプトや CSS を読み込ませない安全対策。
       取り込んだ壁紙・BGM は、アプリ専用の読み込み口 app-media: からだけ読めるようにする -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' app-media:; media-src 'self' app-media:">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- 画面の文字は renderer.js が翻訳表 (i18n.js) から入れる。
     data-i18n="項目" は文字、data-i18n-aria="項目" は読み上げ用の名前 (aria-label) を差し替える -->
<body data-mode="work">
  <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

  <div class="update-banner" id="update-banner" role="status" hidden>
    <span id="update-text"></span>
    <progress id="update-progress" max="100" value="0" hidden></progress>
    <span class="update-actions">
      <button type="button" id="update-action" class="small"></button>
      <button type="button" id="update-later" class="small ghost" data-i18n="later"></button>
    </span>
  </div>

  <!-- 右上のボタン。全画面ボタンの名前 (aria-label) は、全画面かどうかで renderer.js が切り替える -->
  <div class="top-actions">
    <button type="button" class="icon-button" id="toggle-fullscreen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="icon-enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
        <path class="icon-exit" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
      </svg>
    </button>
    <button type="button" class="icon-button" id="open-settings" data-i18n-aria="settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
  </div>

  <main class="app">
    <nav class="modes" aria-label="Mode">
      <span class="mode-tab" data-mode-tab="work" data-i18n="mode.work"></span>
      <span class="mode-tab" data-mode-tab="shortBreak" data-i18n="mode.shortBreak"></span>
      <span class="mode-tab" data-mode-tab="longBreak" data-i18n="mode.longBreak"></span>
    </nav>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="90"></circle>
        <circle class="progress" id="progress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="readout">
        <div class="time" id="time">25:00</div>
        <div class="label" id="label"></div>
      </div>
    </div>

    <div class="controls">
      <button id="reset" class="secondary" data-i18n="reset"></button>
      <button id="toggle" class="primary"></button>
      <button id="skip" class="secondary" data-i18n="skip"></button>
    </div>

    <p class="stats" id="stats"><span data-i18n="today"></span> <strong id="today">0</strong> · <span data-i18n="round"></span> <strong id="cycle">0</strong>/<span id="interval">4</span></p>
  </main>

  <!-- BGM の再生バー。BGM を選んでいるときだけ画面の下に出す (renderer.js)。
       ノイズのときは、前へ・次へ・再生位置を使えない表示にする。図はすべてこのファイルで描いている -->
  <section class="player" id="player" data-i18n-aria="bgm" hidden>
    <input type="range" class="player-seek" id="player-seek" min="0" max="1" step="any" value="0" data-i18n-aria="playerSeek">
    <div class="player-row">
      <div class="player-transport">
        <button type="button" class="player-button" id="player-prev" data-i18n-aria="playerPrev">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6 5h2.5v14H6zM19 5v14L9.5 12z"/></svg>
        </button>
        <button type="button" class="player-button play" id="player-toggle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="fill icon-play" d="M8 4.5v15L20 12z"/>
            <path class="fill icon-pause" d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/>
          </svg>
        </button>
        <button type="button" class="player-button" id="player-next" data-i18n-aria="playerNext">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M15.5 5H18v14h-2.5zM5 5v14l9.5-7z"/></svg>
        </button>
      </div>
      <div class="player-info">
        <span class="player-title" id="player-title"></span>
        <span class="player-time" id="player-time"></span>
      </div>
      <div class="player-options">
        <button type="button" class="player-button small" id="player-repeat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 2.5l3 3-3 3M4 11V9.5a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 13v1.5a4 4 0 0 1-4 4H4"/>
            <path class="icon-repeat-one" d="M11 10.5l1.5-1v5.5"/>
          </svg>
        </button>
        <button type="button" class="player-button small" id="player-shuffle" data-i18n-aria="shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4h4v4M4 19.5L20 4M20 16v4h-4M14.5 14.5L20 20M4 4.5l5 5"/></svg>
        </button>
        <button type="button" class="player-button small" id="player-open-volume" data-i18n-aria="playerVolume" aria-expanded="false" aria-controls="player-volume-popup">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="fill" d="M4 9h3.5L12 5v14l-4.5-4H4z"/>
            <path class="icon-sound" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
            <path class="icon-muted" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
          </svg>
        </button>
        <button type="button" class="player-button small" id="player-open-list" data-i18n-aria="playlist" aria-expanded="false" aria-controls="player-list-popup">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h11M3 11h11M3 16h7M17.5 17.5V6.5l3.5-1"/>
            <circle cx="15.5" cy="17.5" r="2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 音量の小窓 (BGM の音量だけを動かす。Sound タブの BGM の音量と同じ設定) -->
    <div class="player-popup volume-popup" id="player-volume-popup" hidden>
      <input type="range" id="player-volume" min="0" max="100" step="5" data-i18n-aria="playerVolume">
      <output for="player-volume" id="player-volume-output"></output>
    </div>

    <!-- 再生リストの小窓。上でプレイリスト (全曲・自分で作ったもの) を切り替える。
         曲を押すと再生し、ドラッグ (または Alt + ↑ / ↓) で並べ替える。
         「編集」では、全曲の一覧のチェックで、プレイリストに入れる曲を選ぶ -->
    <div class="player-popup list-popup" id="player-list-popup" hidden>
      <div class="playlist-bar">
        <select id="playlist-choose" class="select" data-i18n-aria="playlist"></select>
        <button type="button" class="player-button small" id="playlist-new" data-i18n-aria="playlistNew">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="secondary small" id="playlist-edit" data-i18n="playlistEdit"></button>
      </div>
      <!-- 新しく作るときと、編集中の名前の変更に使う -->
      <form class="playlist-form" id="playlist-form" hidden>
        <input type="text" id="playlist-name" class="text-input" maxlength="20" autocomplete="off" data-i18n-aria="playlistName">
        <button type="submit" class="secondary small" id="playlist-save" data-i18n="save"></button>
        <button type="button" class="secondary small" id="playlist-cancel" data-i18n="cancel"></button>
      </form>
      <ol class="playlist" id="playlist"></ol>
      <div class="playlist-edit-actions" id="playlist-edit-actions" hidden>
        <button type="button" class="secondary small danger" id="playlist-delete" data-i18n="playlistDelete"></button>
        <button type="button" class="secondary small" id="playlist-done" data-i18n="playlistDone"></button>
      </div>
      <p class="hint" id="playlist-hint"></p>
    </div>
  </section>

  <div class="settings-panel" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="panel-header">
      <h2 id="settings-title" data-i18n="settings"></h2>
      <button type="button" class="icon-button" id="close-settings" data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-timer" data-tab="timer" aria-controls="panel-timer" aria-selected="true" data-i18n="tabTimer"></button>
      <button type="button" role="tab" id="tab-sound" data-tab="sound" aria-controls="panel-sound" aria-selected="false" tabindex="-1" data-i18n="tabSound"></button>
      <button type="button" role="tab" id="tab-appearance" data-tab="appearance" aria-controls="panel-appearance" aria-selected="false" tabindex="-1" data-i18n="tabAppearance"></button>
      <button type="button" role="tab" id="tab-general" data-tab="general" aria-controls="panel-general" aria-selected="false" tabindex="-1" data-i18n="tabGeneral"></button>
    </div>

    <section class="tab-panel" id="panel-timer" role="tabpanel" aria-labelledby="tab-timer">
      <!-- プリセット (renderer.js が presets.js の一覧から作る)。押すと 4 つのホイールがまとめて変わる -->
      <div class="preset-list" id="preset-list" role="radiogroup" data-i18n-aria="presets"></div>
      <div class="preset-save">
        <button type="button" class="secondary small" id="preset-save-open" data-i18n="presetSave"></button>
        <form class="preset-form" id="preset-form" hidden>
          <input type="text" id="preset-name" class="text-input" maxlength="20" autocomplete="off" data-i18n-aria="presetName">
          <button type="submit" class="secondary small" data-i18n="save"></button>
          <button type="button" class="secondary small" id="preset-cancel" data-i18n="cancel"></button>
        </form>
        <p class="hint" id="preset-hint" hidden></p>
      </div>
      <!-- 各列のホイールは renderer.js が data-setting の項目ごとに作る。変更はすぐ反映される -->
      <div class="wheels">
        <div class="wheel-column" data-setting="workMinutes" data-label-key="wheelFocusAria"><span class="wheel-title" data-i18n="wheelFocus"></span><span class="wheel-unit" data-i18n="unitMin"></span></div>
        <div class="wheel-column" data-setting="shortBreakMinutes" data-label-key="wheelShortAria"><span class="wheel-title" data-i18n="wheelShort"></span><span class="wheel-unit" data-i18n="unitMin"></span></div>
        <div class="wheel-column" data-setting="longBreakMinutes" data-label-key="wheelLongAria"><span class="wheel-title" data-i18n="wheelLong"></span><span class="wheel-unit" data-i18n="unitMin"></span></div>
        <div class="wheel-column" data-setting="longBreakInterval" data-label-key="wheelRoundsAria"><span class="wheel-title" data-i18n="wheelRounds"></span><span class="wheel-unit" data-i18n="unitTimes"></span></div>
      </div>
    </section>

    <section class="tab-panel" id="panel-sound" role="tabpanel" aria-labelledby="tab-sound" hidden>
      <!-- マスター音量: 下の 3 つの音量に掛け算され、すべての音をまとめて上げ下げする -->
      <div class="volume-row master">
        <label for="master-volume" data-i18n="master"></label>
        <input type="range" id="master-volume" data-volume="masterVolume" min="0" max="100" step="5">
        <output for="master-volume"></output>
      </div>
      <div class="volume-row">
        <label for="alarm-volume" data-i18n="alarm"></label>
        <input type="range" id="alarm-volume" data-volume="alarmVolume" min="0" max="100" step="5">
        <output for="alarm-volume"></output>
        <button type="button" class="secondary small" data-test="alarm" data-i18n="test"></button>
      </div>
      <div class="choice-list compact" id="alarm-list" role="radiogroup" data-i18n-aria="alarm"></div>
      <div class="volume-row">
        <label for="bgm-volume" data-i18n="bgm"></label>
        <input type="range" id="bgm-volume" data-volume="bgmVolume" min="0" max="100" step="5">
        <output for="bgm-volume"></output>
        <button type="button" class="secondary small" data-test="bgm" data-i18n="test"></button>
      </div>
      <div class="choice-list" id="bgm-list" role="radiogroup" data-i18n-aria="bgm"></div>
      <p class="hint" data-i18n="bgmHint"></p>
      <div class="volume-row">
        <label for="se-volume" data-i18n="se"></label>
        <input type="range" id="se-volume" data-volume="seVolume" min="0" max="100" step="5">
        <output for="se-volume"></output>
        <button type="button" class="secondary small" data-test="se" data-i18n="test"></button>
      </div>
      <div class="choice-list compact" id="se-list" role="radiogroup" data-i18n-aria="se"></div>
      <!-- 音量とアラーム・効果音の音を既定値に戻す (BGM の選択は残す)。押すと確認を出す -->
      <button type="button" class="secondary small reset-sound" id="reset-sound" data-i18n="resetSound"></button>
    </section>

    <section class="tab-panel" id="panel-appearance" role="tabpanel" aria-labelledby="tab-appearance" hidden>
      <div class="row" role="radiogroup" data-i18n-aria="theme">
        <span data-i18n="theme"></span>
        <span class="segmented">
          <label><input type="radio" name="theme" value="system"><span data-i18n="themeAuto"></span></label>
          <label><input type="radio" name="theme" value="light"><span data-i18n="themeLight"></span></label>
          <label><input type="radio" name="theme" value="dark"><span data-i18n="themeDark"></span></label>
        </span>
      </div>
      <h3 class="section-title" data-i18n="wallpaper"></h3>
      <div class="wallpaper-grid" id="wallpaper-grid" role="radiogroup" data-i18n-aria="wallpaper"></div>
      <!-- 壁紙がないときはカードが出ないので、スライダーは操作できなくする (renderer.js) -->
      <div class="slider-row">
        <label for="card-opacity" data-i18n="cardOpacity"></label>
        <input type="range" id="card-opacity" min="0" max="100" step="5">
        <output for="card-opacity"></output>
      </div>
      <p class="hint" id="card-opacity-hint" data-i18n="cardOpacityHint"></p>
    </section>

    <section class="tab-panel" id="panel-general" role="tabpanel" aria-labelledby="tab-general" hidden>
      <div class="row">
        <label for="language" data-i18n="language"></label>
        <select id="language" class="select"></select>
      </div>
      <div class="row">
        <label for="show-stats" data-i18n="showStats"></label>
        <!-- チェックボックスを、オン / オフのスイッチの見た目にする -->
        <input type="checkbox" id="show-stats" class="switch" role="switch">
      </div>
      <!-- クレジット。「Pomodoro Technique®」の書き方は、商標の持ち主のガイドラインに合わせている -->
      <h3 class="section-title" data-i18n="credits"></h3>
      <dl class="credits">
        <dt data-i18n="creditAuthor"></dt>
        <dd>marusako <button type="button" class="link-button" id="open-repository" hidden>GitHub</button></dd>
        <dt data-i18n="creditDevelopedWith"></dt>
        <dd data-i18n="creditClaude"></dd>
        <dt>Pomodoro Technique®</dt>
        <dd><span data-i18n="creditPomodoro"></span> <span data-i18n="creditPomodoroDisclaimer"></span></dd>
      </dl>
    </section>

    <p class="version" id="app-version" hidden></p>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
